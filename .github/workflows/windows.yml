name: Windows

on:
  push:
    branches: [main]
    paths:
      - "eves_text/**"
      - "windows/**"
      - ".github/workflows/windows.yml"
    tags: ["win-v*"]
  pull_request:
    paths:
      - "eves_text/**"
      - "windows/**"
      - ".github/workflows/windows.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Сборка Windows-версии
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Получить исходники
        uses: actions/checkout@v4

      - name: Установить MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          cache: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-gobject
            mingw-w64-ucrt-x86_64-gtk3
            mingw-w64-ucrt-x86_64-gtksourceview4
            mingw-w64-ucrt-x86_64-gspell
            mingw-w64-ucrt-x86_64-enchant
            mingw-w64-ucrt-x86_64-hunspell
            mingw-w64-ucrt-x86_64-librsvg
            mingw-w64-ucrt-x86_64-adwaita-icon-theme
            mingw-w64-ucrt-x86_64-adwaita-icon-theme-legacy
            mingw-w64-ucrt-x86_64-hicolor-icon-theme
            mingw-w64-ucrt-x86_64-fontconfig
            mingw-w64-ucrt-x86_64-glib2

      - name: Собрать переносимый бандл
        run: bash windows/build-portable.sh

      - name: Проверить нативный лаунчер
        shell: pwsh
        run: |
          $exe = "windows\dist\Eve's Text\Eve's Text.exe"
          if (-not (Test-Path $exe)) { throw "Лаунчер не собран: $exe" }
          $bytes = [IO.File]::ReadAllBytes($exe)
          $pe = [BitConverter]::ToInt32($bytes, 0x3C)
          $subsystem = [BitConverter]::ToUInt16($bytes, $pe + 24 + 68)
          if ($subsystem -ne 2) { throw "Лаунчер должен быть GUI-приложением, subsystem=$subsystem" }
          Write-Host "GUI-лагер OK (subsystem=$subsystem)"

      - name: Проверить иконку лаунчера
        shell: pwsh
        run: |
          & "windows\dist\Eve's Text\bin\python.exe" "windows\check_icon.py" "windows\dist\Eve's Text\Eve's Text.exe"
          if ($LASTEXITCODE -ne 0) { throw "Иконка не встроена в Eve's Text.exe" }

      - name: Проверить рантайм
        shell: pwsh
        run: |
          & "windows\dist\Eve's Text\bin\python.exe" "windows\dist\Eve's Text\app\check_runtime.py"

      - name: Проверить окно
        shell: pwsh
        run: |
          & "windows\dist\Eve's Text\bin\python.exe" "windows\dist\Eve's Text\app\check_runtime.py" --gui

      - name: Упаковать портативную версию
        shell: pwsh
        run: |
          $version = (Select-String -Path eves_text/__init__.py -Pattern '__version__ = "([^"]+)"').Matches.Groups[1].Value
          "VERSION=$version" >> $env:GITHUB_ENV
          $zip = "EvesText-$version-win64-portable.zip"
          Compress-Archive -Path "windows/dist/Eve's Text" -DestinationPath $zip -CompressionLevel Optimal
          "ZIP_NAME=$zip" >> $env:GITHUB_ENV

      - name: Установить Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Собрать установщик
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$env:VERSION" "windows\eves-text.iss"
          $setup = "windows/dist-installer/EvesText-$env:VERSION-win64-setup.exe"
          if (-not (Test-Path $setup)) { throw "Установщик не собран: $setup" }
          "SETUP_NAME=$setup" >> $env:GITHUB_ENV

      - name: Загрузить артефакты
        uses: actions/upload-artifact@v4
        with:
          name: EvesText-win64
          path: |
            ${{ env.ZIP_NAME }}
            ${{ env.SETUP_NAME }}
          if-no-files-found: error

      - name: Создать релиз по тегу
        if: startsWith(github.ref, 'refs/tags/win-v')
        uses: softprops/action-gh-release@v2
        with:
          name: Eve's Text ${{ env.VERSION }} для Windows
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            ${{ env.ZIP_NAME }}
            ${{ env.SETUP_NAME }}
