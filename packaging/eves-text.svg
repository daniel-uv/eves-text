<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="Eve's Text">
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f2f5f8"/>
    </linearGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef2f7"/>
      <stop offset="1" stop-color="#d9e1ea"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0524a"/>
      <stop offset="1" stop-color="#c22b25"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#1d2733" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- Лист с маленьким срезанным уголком -->
  <path d="M30 10 H90 L106 26 V112 a6 6 0 0 1 -6 6 H30 a6 6 0 0 1 -6 -6 V16 a6 6 0 0 1 6 -6 Z"
        fill="url(#page)" stroke="#bcc7d3" stroke-width="2" stroke-linejoin="round"
        filter="url(#shadow)"/>

  <!-- Загнутый уголок -->
  <path d="M90 10 V22 a4 4 0 0 0 4 4 H106 Z"
        fill="url(#fold)" stroke="#bcc7d3" stroke-width="2" stroke-linejoin="round"/>

  <!-- Буква E: острые углы, все полоски одинаковой длины -->
  <path d="M43 34 H87 V46 H55 V58 H87 V70 H55 V82 H87 V94 H43 Z"
        fill="url(#ink)"/>
</svg>
